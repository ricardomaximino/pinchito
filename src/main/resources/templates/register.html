<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Pinchito Gestor de Deudas Amorosas</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="glass-card auth-card" style="max-width: 500px;">
            <h1 class="logo auth-title" style="justify-content: center; margin-bottom: 0.5rem;">
                Pinchito <span class="logo-heart">❤</span>
            </h1>
            <p class="auth-subtitle">Cread un espacio compartido para vuestra relación</p>
            
            <div th:if="${error}" class="error-message" th:text="${error}"></div>

            <form th:action="@{/register}" method="post" id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="accountName">Nombre de la Cuenta</label>
                    <input type="text" id="accountName" name="accountName" class="form-control" placeholder="p. ej. pareja_ideal" required autofocus>
                </div>
                
                <h3 style="margin-bottom: 1rem; font-size: 1.1rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem;">Miembros de la Relación</h3>
                <div id="membersContainer">
                    <!-- Member 1 -->
                    <div class="member-input-row">
                        <div>
                            <label class="form-label">Usuario del Miembro 1</label>
                            <input type="text" name="usernames" class="form-control" placeholder="p. ej. Alicia" required>
                        </div>
                        <div>
                            <label class="form-label">Contraseña del Miembro 1</label>
                            <input type="password" name="passwords" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>
                    <!-- Member 2 -->
                    <div class="member-input-row">
                        <div>
                            <label class="form-label">Usuario del Miembro 2</label>
                            <input type="text" name="usernames" class="form-control" placeholder="p. ej. Bob" required>
                        </div>
                        <div>
                            <label class="form-label">Contraseña del Miembro 2</label>
                            <input type="password" name="passwords" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>
                </div>
                
                <button type="button" class="btn-add-member" onclick="addMemberRow()" id="btn-add-member">
                    <span>+</span> Añadir Otro Miembro
                </button>
                
                <button type="submit" class="btn-primary" id="btn-register-submit">
                    Crear Espacio Compartido
                </button>
            </form>
            
            <div class="auth-footer">
                ¿Ya tenéis un espacio compartido? <br>
                <a th:href="@{/}">Iniciar sesión aquí</a>
            </div>
        </div>
    </div>

    <script>
        let memberCount = 2;
        function addMemberRow() {
            memberCount++;
            const container = document.getElementById('membersContainer');
            const row = document.createElement('div');
            row.className = 'member-input-row';
            row.innerHTML = `
                <div>
                    <label class="form-label">Usuario del Miembro ${memberCount}</label>
                    <input type="text" name="usernames" class="form-control" placeholder="p. ej. Carlos" required>
                </div>
                <div>
                    <label class="form-label">Contraseña del Miembro ${memberCount}</label>
                    <input type="password" name="passwords" class="form-control" placeholder="••••••••" required>
                </div>
            `;
            container.appendChild(row);
        }
    </script>
</body>
</html>
